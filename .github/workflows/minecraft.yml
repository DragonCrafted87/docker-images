name: minecraft

on:
  pull_request:
  push:
    branches:
    - main
    tags:
    - base-v*
    - minecraft-v*

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Base tests
      run: python3 -m unittest discover -s base/tests -v
    - name: Startup tests
      run: python3 -m unittest discover -s minecraft/tests -v

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Image names
      id: image
      run: |
        owner="${GITHUB_REPOSITORY_OWNER,,}"
        echo "base=ghcr.io/${owner}/alpine" >> "$GITHUB_OUTPUT"
        echo "minecraft=ghcr.io/${owner}/alpine-minecraft" >> "$GITHUB_OUTPUT"
    - name: Publish which images
      id: push
      run: |
        base=false
        minecraft=false
        ref="$GITHUB_REF"
        if [ "$GITHUB_EVENT_NAME" != "pull_request" ] && [ "$ref" = "refs/heads/main" ]; then
        base=true
        minecraft=true
        fi
        if [ "$GITHUB_EVENT_NAME" != "pull_request" ] && [ "${ref#refs/tags/base-v}" != "$ref" ]; then
        base=true
        fi
        if [ "$GITHUB_EVENT_NAME" != "pull_request" ] && [ "${ref#refs/tags/minecraft-v}" != "$ref" ]; then
        minecraft=true
        fi
        echo "base=$base" >> "$GITHUB_OUTPUT"
        echo "minecraft=$minecraft" >> "$GITHUB_OUTPUT"
    - name: Base meta
      id: base-meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ steps.image.outputs.base }}
        bake-target: base-meta
        flavor: |
          latest=false
        tags: |
          type=raw,value=3.24,enable={{is_default_branch}}
          type=edge,branch=main
          type=match,pattern=base-v(.*),group=1
          type=sha
    - name: Minecraft meta
      id: minecraft-meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ steps.image.outputs.minecraft }}
        bake-target: minecraft-meta
        flavor: |
          latest=false
        tags: |
          type=edge,branch=main
          type=match,pattern=minecraft-v(.*),group=1
          type=sha
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Login to GHCR
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build
      uses: docker/bake-action@v6
      with:
        source: .
        targets: base,minecraft
        files: |
          ./docker-bake.hcl
          cwd://${{ steps.base-meta.outputs.bake-file }}
          cwd://${{ steps.minecraft-meta.outputs.bake-file }}
        set: |
          PUSH_BASE=${{ steps.push.outputs.base }}
          PUSH_MINECRAFT=${{ steps.push.outputs.minecraft }}
